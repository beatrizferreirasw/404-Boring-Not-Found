<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Sultan's Arcade</title>
  <meta name="description" content="A little collection of games, made with love.">
  <meta name="theme-color" content="#070b1d">
  <link rel="icon" href="assets/art/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Monoton&family=Outfit:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="spot spot-l"></div>
    <div class="spot spot-r"></div>
  </div>

  <header class="hero">
    <div class="hero-actions">
      <a class="btn" href="ticket/" data-nav id="collection-link" data-i18n="home.collection" hidden>🎟️ My collectibles</a>
      <button class="btn lang" data-lang-toggle type="button">PT</button>
      <button class="btn icon" data-mute-toggle type="button"></button>
    </div>
    <p class="eyebrow" data-i18n="home.eyebrow">Now playing at</p>
    <h1 class="sign"><span class="neon flicker" id="site-title">The Sultan's Arcade</span></h1>
    <p class="subtitle" id="site-subtitle"></p>
    <div class="marquee" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </header>

  <main>
    <section aria-labelledby="featured-h" id="featured"></section>
    <section aria-labelledby="more-h" class="more">
      <h2 id="more-h" class="section-title" data-i18n="home.more">More games</h2>
      <ul class="grid" id="grid" role="list"></ul>
    </section>
  </main>

  <footer class="foot"><span id="site-footer"></span></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/arcade.js"></script>
  <script src="assets/js/registry.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
