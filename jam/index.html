<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jam Session · The Sultan's Arcade</title>
  <meta name="theme-color" content="#070b1d">
  <link rel="icon" href="../assets/art/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Monoton&family=Outfit:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/minigame.css">
  <style>
    .board-wrap { max-width: 560px; margin: 0 auto; padding: 22px; border-radius: 26px; background: linear-gradient(180deg, #2a2f3d, #171a24); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .08), 0 30px 60px -20px rgba(0, 0, 0, .9); }
    .pedals { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 2.4vw, 16px); }
    .pedal {
      --c: #ff3b52;
      position: relative; aspect-ratio: 3 / 4.4; border: 0; border-radius: 12px; cursor: pointer; padding: 10px 6px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--c) 85%, #fff 15%), color-mix(in srgb, var(--c) 70%, #000 30%));
      box-shadow: 0 8px 0 color-mix(in srgb, var(--c) 45%, #000 55%), 0 14px 22px rgba(0, 0, 0, .6);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      transition: transform .08s, box-shadow .08s, filter .15s; color: rgba(0, 0, 0, .65);
      font: 700 clamp(9px, 2.2vw, 12px)/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase;
    }
    .pedal .led { width: 12px; height: 12px; border-radius: 50%; background: #3a0a10; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .6); transition: .1s; }
    .pedal .knobs { display: flex; gap: 6px; }
    .pedal .knobs i { width: clamp(12px, 3.5vw, 20px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #eee, #555); box-shadow: 0 2px 3px rgba(0, 0, 0, .5); }
    .pedal .stomp { width: 46%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f2f2f2, #8a8a8a 60%, #444); box-shadow: 0 4px 6px rgba(0, 0, 0, .6), inset 0 -3px 0 rgba(0, 0, 0, .3); }
    .pedal.lit, .pedal:active { transform: translateY(6px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 45%, #000 55%), 0 0 40px var(--c); filter: brightness(1.25); }
    .pedal.lit .led, .pedal:active .led { background: #ff4d4d; box-shadow: 0 0 12px #ff4d4d, 0 0 4px #fff; }
    .pedal:disabled { cursor: default; }
    .pedal kbd { font: inherit; opacity: .6; }
    .msg { min-height: 28px; margin: 18px 0 0; font: 400 26px/1 var(--font-display); letter-spacing: .08em; color: var(--cream); }
    .msg.listen { color: var(--neon-blue); } .msg.play { color: var(--green); } .msg.bad { color: var(--neon-red); }
    #go { margin-top: 18px; }
  </style>
</head>
<body data-title-key="title.jam">
  <header class="topbar">
    <a class="btn" href="../" data-nav data-i18n-attr="aria-label:nav.back">← <span data-i18n="nav.arcade">Arcade</span></a>
    <span class="spacer"></span>
    <button class="btn lang" data-lang-toggle type="button">PT</button>
    <button class="btn icon" data-mute-toggle type="button"></button>
  </header>
  <main class="game-main">
    <h1 class="game-title neon" style="--glow: var(--gold)">Jam Session</h1>
    <p class="game-sub" data-i18n-html="j.sub"></p>
    <div class="stats">
      <div class="stat"><span data-i18n="j.level">Riff length</span><b id="level">0</b></div>
      <div class="stat"><span data-i18n="j.best">Best</span><b id="best">0</b></div>
    </div>
    <div class="board-wrap">
      <div class="pedals" id="pedals">
        <button class="pedal" style="--c:#ff3b52" data-i="0" data-i18n-attr="aria-label:j.p0"><span class="led"></span><span class="knobs"><i></i><i></i></span><span class="stomp"></span><span>Drive <kbd>1</kbd></span></button>
        <button class="pedal" style="--c:#4fd1ff" data-i="1" data-i18n-attr="aria-label:j.p1"><span class="led"></span><span class="knobs"><i></i><i></i></span><span class="stomp"></span><span>Chorus <kbd>2</kbd></span></button>
        <button class="pedal" style="--c:#e8c36a" data-i="2" data-i18n-attr="aria-label:j.p2"><span class="led"></span><span class="knobs"><i></i><i></i></span><span class="stomp"></span><span>Delay <kbd>3</kbd></span></button>
        <button class="pedal" style="--c:#4ade80" data-i="3" data-i18n-attr="aria-label:j.p3"><span class="led"></span><span class="knobs"><i></i><i></i></span><span class="stomp"></span><span>Reverb <kbd>4</kbd></span></button>
      </div>
    </div>
    <p class="msg" id="msg" aria-live="polite" data-i18n="j.ready">Ready when you are.</p>
    <button class="btn primary" type="button" id="go" data-i18n="j.start">▶ Start jamming</button>
  </main>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/arcade.js"></script>
  <script>
    (function () {
      const { sfx, fx, store } = Arcade;
      const { t } = I18n;
      const NOTES = [220, 261.63, 329.63, 392];
      const pedals = [...document.querySelectorAll(".pedal")];
      const msg = document.getElementById("msg");
      let seq = [], pos = 0, accepting = false;
      const say = (t, cls = "") => { msg.textContent = t; msg.className = "msg " + cls; };
      document.getElementById("best").textContent = store.get("jam-best", 0);

      function flash(i, ms = 320) {
        const p = pedals[i];
        p.classList.add("lit"); sfx.pluck(NOTES[i], { vol: 0.6, dur: 1.2 });
        setTimeout(() => p.classList.remove("lit"), ms);
      }

      function playSeq() {
        accepting = false; say(t("j.listen"), "listen");
        const gap = Math.max(260, 600 - seq.length * 22);
        seq.forEach((n, k) => setTimeout(() => flash(n, gap * 0.6), 500 + k * gap));
        setTimeout(() => { accepting = true; pos = 0; say(t("j.turn"), "play"); }, 500 + seq.length * gap);
      }

      function next() {
        seq.push(Math.floor(Math.random() * 4));
        document.getElementById("level").textContent = seq.length;
        playSeq();
      }

      function press(i) {
        if (!accepting) return;
        flash(i, 180);
        if (i !== seq[pos]) {
          accepting = false;
          const reached = seq.length - 1;
          const best = store.get("jam-best", 0);
          setTimeout(() => sfx.bad(), 120);
          if (reached > best) { store.set("jam-best", reached); document.getElementById("best").textContent = reached; say(t("j.record", { n: reached }), "play"); fx.burst({ y: innerHeight * 0.4 }); sfx.win(); }
          else say(t("j.bum", { n: reached }), "bad");
          document.getElementById("go").hidden = false;
          document.getElementById("go").removeAttribute("data-i18n");
          document.getElementById("go").textContent = t("j.again");
          return;
        }
        pos++;
        if (pos === seq.length) {
          accepting = false;
          if (seq.length % 5 === 0) { setTimeout(() => sfx.good(), 250); fx.burst({ y: innerHeight * 0.45, count: 60 }); say(t("j.rock"), "play"); }
          setTimeout(next, 900);
        }
      }

      pedals.forEach((p) => p.addEventListener("pointerdown", (e) => { e.preventDefault(); press(+p.dataset.i); }));
      pedals.forEach((p) => p.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); press(+p.dataset.i); } }));
      document.addEventListener("keydown", (e) => { const k = "1234".indexOf(e.key); if (k >= 0) press(k); });
      document.getElementById("go").addEventListener("click", (e) => { sfx.unlock(); seq = []; e.currentTarget.hidden = true; next(); });
    })();
  </script>
</body>
</html>
